name: Output demo
on: push
jobs: 
   build:
     outputs:
        version: ${{ steps.step1.outputs.version}}
     runs-on: ubuntu-latest
     steps:
        - name: Build
          id: step1
          run: echo "version=1.0" >> $GITHUB_OUTPUT
   deploy:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: deploy
          run: echo "app deployment with version ${{ needs.build.outputs.version }}"
   
     
          
